server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css text/javascript application/javascript;   # dw.js pesa ~800 KB y comprime mucho

    # Sitio estático. Se revalida siempre para que un cambio se vea al recargar.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
