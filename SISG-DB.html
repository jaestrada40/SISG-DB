<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SISG · Base de datos, paso a paso</title>
<meta name="description" content="Curso interactivo de la base de datos de SISG: de la aplicación al almacén de datos, con ER, ETL, modelo estrella y consultas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
/* SISG-DB · Curso interactivo de la base de datos de SISG.
   Estilo: papel crema, tinta oscura, tipografía monoespaciada, bloques isométricos con borde grueso y sombra dura. */
:root {
  --paper: #f4ebe0;
  --card: #faf4ea;
  --ink: #1d1b18;
  --muted: #6f6961;
  --line: rgba(29, 27, 24, .16);
  --grid: rgba(29, 27, 24, .07);
  --lime: #cfe3b2;
  --lav: #ddd3f2;
  --sky: #d6e6f5;
  --rose: #f6d3cf;
  --sun: #f6e2a8;
  --c-orange: #f3b17a;
  --c-blue: #a9c8ee;
  --c-purple: #c9b8ee;
  --c-green: #b9d99a;
  --c-pink: #f0a4a8;
  --c-teal: #8fd0c4;
  --c-yellow: #f6d98a;
  --shadow: 3px 3px 0 var(--ink);
  --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #1a1815;
  --card: #23201c;
  --ink: #efe6d8;
  --muted: #a39a8c;
  --line: rgba(239, 230, 216, .18);
  --grid: rgba(239, 230, 216, .06);
  --lime: #4d6035;
  --lav: #3f3860;
  --sky: #2e4560;
  --rose: #61363a;
  --sun: #5e5028;
  --shadow: 3px 3px 0 #000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 13px/1.55 var(--font); overflow: hidden;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
code, .mono { font-family: var(--font); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: 58px minmax(0, 1fr); }

/* ---------- barra superior ---------- */
.top { display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; text-decoration: none; white-space: nowrap; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand mark { background: var(--lime); padding: 0 4px; color: inherit; }
.tabs { display: flex; gap: 8px; margin-left: 12px; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border: 2px solid transparent; border-radius: 10px; background: none; font-weight: 600; color: var(--ink); text-decoration: none; }
.tab:hover { background: rgba(29, 27, 24, .06); }
.tab[aria-current="page"] { background: var(--lime); border-color: var(--ink); box-shadow: var(--shadow); }
.tab svg { width: 16px; height: 16px; }
.top .grow { flex: 1; }
.search-btn { display: flex; align-items: center; gap: 10px; width: min(300px, 28vw); padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted); text-align: left; }
.search-btn:hover { border-color: var(--ink); }
.search-btn span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-btn kbd, .kbd { font: 500 11px var(--font); padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--muted); }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
#b-menu { display: none; }

/* ---------- estructura ---------- */
.shell { display: grid; grid-template-columns: 262px minmax(0, 1fr) 336px; gap: 14px; padding: 14px; min-height: 0; }
.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; min-width: 0; min-height: 0; }
.scroll { overflow-y: auto; }

/* ---------- árbol del curso ---------- */
#tree { display: flex; flex-direction: column; padding: 16px 12px 12px; }
.tree-head { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 12px; font-weight: 800; font-size: 15px; }
.tree-head small { font-weight: 400; color: var(--muted); font-size: 11px; }
.tree-body { flex: 1; overflow-y: auto; padding-right: 2px; }
.mod { margin-bottom: 4px; }
.mod > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; background: none; border-radius: 8px; font-weight: 800; font-size: 13.5px; text-align: left; }
.mod > button:hover { background: rgba(29, 27, 24, .05); }
.mod .chev { width: 14px; height: 14px; transition: transform .15s; flex: none; color: var(--muted); }
.mod.open .chev { transform: rotate(90deg); }
.mod .fold { width: 22px; height: 18px; flex: none; }
.mod .cnt { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--muted); }
.mod ul { list-style: none; margin: 2px 0 6px 18px; padding: 0 0 0 12px; border-left: 1.5px solid var(--line); display: none; }
.mod.open ul { display: block; }
.lsn { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 6px 8px; margin: 1px 0; border: 2px solid transparent; border-radius: 9px; background: none; text-align: left; text-decoration: none; color: inherit; font-size: 12.5px; }
.lsn:hover { background: rgba(29, 27, 24, .05); }
.lsn svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--muted); }
.lsn.done svg { color: #3b7a2a; }
.lsn[aria-current="page"] { background: var(--lime); border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); font-weight: 700; }
.lsn[aria-current="page"] svg { color: var(--ink); }
.prog { margin-top: 10px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; }
.prog .row { display: flex; justify-content: space-between; font-weight: 800; letter-spacing: .06em; font-size: 12px; }
.prog .bar { height: 7px; margin-top: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
.credit { margin-top: 8px; font-size: 10.5px; color: var(--muted); padding: 0 4px; }

/* ---------- lección ---------- */
#main { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.crumb { color: var(--muted); font-size: 12px; }
.crumb b { font-weight: 500; color: var(--ink); }
.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
h1.lt { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; }
.chips { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border: 1.5px solid var(--ink); border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--sun); box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
.chip.lv { background: var(--lime); } .chip.st { background: var(--lav); }
.chip svg { width: 13px; height: 13px; }
.sub { margin: -6px 0 0; color: var(--muted); }

#main > * { flex-shrink: 0; }
.stage { position: relative; border: 1.5px solid var(--line); border-radius: 16px; background: #f1e7d9; padding: 10px; overflow: hidden; }
:root[data-theme="dark"] .stage { background: #1e1b17; }
.stats { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; position: relative; z-index: 2; }
.stat { flex: 1 1 140px; min-width: 0; padding: 6px 10px 7px; border: 1.5px solid var(--line); border-left: 3px solid var(--ink); border-radius: 8px; background: var(--card); }
.stat small { display: block; font-size: 9.5px; line-height: 1.2; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-height: 2.4em; }
.stat b { display: block; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.pulse b { animation: pulse .6s; }
@keyframes pulse { 0% { background: var(--sun); } 100% { background: transparent; } }
.ctl { display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); font-weight: 600; font-size: 12px; }
.btn:hover:not(:disabled) { background: var(--lime); }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 14px; height: 14px; }
.btn.go { background: var(--lime); box-shadow: var(--shadow); }
.btn.go:hover:not(:disabled) { background: #bfd89b; }

#scene { width: 100%; height: auto; display: block; margin-top: 4px; aspect-ratio: 1000 / 600; }
.nd { transition: opacity .45s ease, transform .45s cubic-bezier(.2, .9, .3, 1.2); transform-box: fill-box; transform-origin: center; }
.nd.off { opacity: 0; transform: scale(.82); pointer-events: none; }
.nd.dim { opacity: .28; }
.ed { transition: opacity .45s ease; }
.ed.off { opacity: 0; }
.ed.dim { opacity: .18; }
.nd .halo { opacity: 0; transition: opacity .3s; }
.nd.focus .halo { opacity: 1; }
.nd.focus .halo { animation: halo 1.6s ease-in-out infinite; }
@keyframes halo { 50% { opacity: .35; } }
.paused .nd .halo, .paused .nd.focus .halo { animation-play-state: paused; }
.note { position: absolute; z-index: 3; max-width: min(340px, 52%); padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); box-shadow: var(--shadow); font-size: 11.5px; line-height: 1.55; transition: opacity .35s, transform .35s; }
.note.off { opacity: 0; transform: translateY(8px); pointer-events: none; }
.note.br { right: 16px; bottom: 14px; } .note.bl { left: 16px; bottom: 14px; } .note.tr { right: 16px; top: 74px; } .note.tl { left: 16px; top: 74px; }
.note h6 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; display: flex; gap: 6px; align-items: center; }
.note div { display: flex; gap: 8px; } .note div b { flex: none; min-width: 3.4em; }
.note div i { font-style: normal; color: var(--muted); }
.note .bad { color: #b3392f; font-weight: 700; } .note .good { color: #2f6e1f; font-weight: 700; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 6px 4px 0; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; border: 1.5px solid var(--ink); margin-right: 6px; vertical-align: -1px; }

.stepper { padding: 12px 16px 10px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); }
.stepper h5 { margin: 0 0 10px; display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.stepper h5 span { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; }
.steps { display: flex; position: relative; overflow-x: auto; padding-bottom: 4px; }
.sp { flex: 1 0 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0 2px; position: relative; font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.25; }
.sp::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 2px; background: var(--ink); z-index: 0; }
.sp:first-child::before { display: none; }
.sp .dot { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--card); font-weight: 700; font-size: 11px; color: var(--ink); transition: .2s; }
.sp .dot svg { width: 14px; height: 14px; }
.sp.done .dot { background: var(--lime); }
.sp[aria-current="step"] .dot { background: var(--lime); box-shadow: var(--shadow); transform: scale(1.12); }
.sp[aria-current="step"] { color: var(--ink); font-weight: 700; }
.sp:hover .dot { background: var(--lime); }

/* ---------- panel derecho ---------- */
#side { display: flex; flex-direction: column; gap: 14px; min-height: 0; background: none; border: 0; }
.stepcard { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
.meta { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tag { padding: 2px 11px; border: 1.5px solid var(--ink); border-radius: 99px; font-size: 11px; font-weight: 700; color: var(--ink); }
.tag.PROBLEMA, .tag.CUIDADO { background: var(--rose); } .tag.IDEA { background: var(--lav); } .tag.SOLUCION { background: var(--lime); }
.tag.COMPROMISO { background: var(--sun); } .tag.RESUMEN { background: var(--sky); } .tag.CASO { background: var(--rose); }
.stepcard h2 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 800; }
.stepcard p { margin: 0; }
.stepcard code, .nt code, table code { padding: 0 5px; border-radius: 5px; background: rgba(29, 27, 24, .09); font-size: .95em; }
.call { display: flex; gap: 10px; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--lav); }
.call.warn { background: var(--rose); } .call.info { background: var(--sky); } .call.ok { background: var(--lime); }
.call svg { width: 22px; height: 22px; flex: none; margin-top: 2px; }
.call b { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
.chg b.h { display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chg ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.chg li { display: flex; gap: 8px; }
.chg s { text-decoration: none; font-weight: 800; width: 12px; flex: none; text-align: center; }
.chg s.p { color: #2f6e1f; } .chg s.m { color: #b3392f; } .chg s.t { color: #8a6410; }
.nav { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
.nav .btn { flex: 1; justify-content: center; min-width: 0; }
.nav .btn.go { text-align: left; justify-content: space-between; font-size: 11px; }
.nav .btn.go span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.keys { display: flex; gap: 8px; justify-content: center; font-size: 10.5px; color: var(--muted); padding-top: 2px; flex-wrap: wrap; }
.learn { padding: 14px 18px 16px; flex: none; }
.learn h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.learn ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.learn li { display: flex; gap: 10px; font-size: 12px; line-height: 1.4; }
.learn .bx { flex: none; width: 17px; height: 17px; margin-top: 1px; border: 1.5px solid var(--ink); border-radius: 4px; display: grid; place-items: center; background: var(--card); }
.learn li.on .bx { background: var(--lime); }
.learn .bx svg { width: 12px; height: 12px; opacity: 0; } .learn li.on .bx svg { opacity: 1; }

/* ---------- Práctica y Chuletas ---------- */
.page { grid-column: 1 / -1; padding: 24px 28px 32px; overflow-y: auto; }
.page h1 { margin: 0 0 4px; font-size: 28px; font-weight: 800; }
.page > p { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.filters button { padding: 5px 13px; border: 1.5px solid var(--line); border-radius: 99px; background: var(--card); font-size: 12px; font-weight: 600; }
.filters button[aria-pressed="true"] { background: var(--lime); border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.q { padding: 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); display: flex; flex-direction: column; gap: 10px; }
.q.known { border-color: var(--ink); }
.q h3 { margin: 0; font-size: 14px; line-height: 1.35; }
.q .t { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.q .ans { padding: 10px 12px; border-radius: 10px; background: var(--sky); border: 1.5px solid var(--line); }
.q .acts { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.cheats { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start; }
.cheat { padding: 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); min-width: 0; }
.cheat h3 { margin: 0 0 4px; font-size: 15px; } .cheat > p { margin: 0 0 10px; color: var(--muted); }
.cheat pre { margin: 8px 0; padding: 38px 12px 12px; overflow-x: auto; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--ink); color: var(--paper); font: 400 12px/1.6 var(--font); position: relative; }
.cheat table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.cheat th { text-align: left; padding: 5px 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1.5px solid var(--ink); }
.cheat td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.copy { position: absolute; top: 6px; right: 6px; padding: 2px 9px; border: 1px solid var(--paper); border-radius: 6px; background: none; color: var(--paper); font-size: 11px; }
.copy:hover { background: var(--paper); color: var(--ink); }

/* ---------- búsqueda ---------- */
#sw { position: fixed; inset: 0; z-index: 60; display: none; place-items: start center; padding: 11vh 16px 16px; background: rgba(29, 27, 24, .45); }
#sw.on { display: grid; }
.sbox { width: min(620px, 100%); max-height: 70vh; display: flex; flex-direction: column; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); box-shadow: 5px 5px 0 var(--ink); }
.sbox input { margin: 12px; padding: 11px 14px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--paper); }
.sres { overflow-y: auto; padding: 0 12px 12px; }
.sres button { display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.sres button:hover, .sres button.sel { background: var(--lime); }
.sres small { display: block; color: var(--muted); font-size: 11px; }
.sempty { padding: 14px; color: var(--muted); }

/* ---------- pantallas angostas ---------- */
@media (max-width: 1260px) { .shell { grid-template-columns: 236px minmax(0, 1fr) 310px; } .tab span { display: none; } }
@media (max-width: 1060px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100%; }
  .shell { grid-template-columns: minmax(0, 1fr); padding: 10px max(10px, env(safe-area-inset-left, 0px)); }
  #tree { display: none; max-height: 60vh; } #tree.open { display: flex; }
  #b-menu { display: grid; }
  #main { overflow: visible; padding: 14px; } .stepcard { overflow: visible; }
  .search-btn { width: 40px; padding: 0; justify-content: center; } .search-btn span, .search-btn kbd { display: none; }
  .top { padding: 0 12px; gap: 8px; } .brand b { display: none; } .tabs { margin-left: 0; }
  .note { position: static; max-width: none; margin-top: 8px; }
  .chips { margin-left: 0; } h1.lt { font-size: 24px; }
  .page { padding: 16px; } .cheats { grid-template-columns: minmax(0, 1fr); } .qgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- ajustes de notas y controles ---------- */
.stats .ctl { margin-left: auto; }
.stat { flex: 1 1 118px; }
.note.mc { left: 50%; top: 50%; translate: -50% -50%; }
.note.bc { left: 50%; bottom: 14px; translate: -50% 0; }
.note.wide { width: max-content; max-width: min(640px, 92%); }
.note.mc.off { transform: scale(.96); }
.note div i { color: var(--ink); opacity: .78; }
@media (max-width: 1060px) { .note.mc, .note.bc { translate: none; } }

/* =====================================================================
   PRESENTACIÓN
   ===================================================================== */
#deck { display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
body.deck-on { overflow: hidden; }
body.dk-full .top { display: none; }
body.dk-full #app { grid-template-rows: minmax(0, 1fr); }
.dk-top { display: flex; align-items: center; gap: 12px; padding: 7px 18px; border-bottom: 1px solid var(--line); font-size: 12px; }
.dk-top .grow { flex: 1; }
.dk-count { font-weight: 800; letter-spacing: .08em; }
.dk-name { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.dk-top button { padding: 5px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); font-size: 12px; font-weight: 600; }
.dk-top button:hover { border-color: var(--ink); background: var(--lime); }
.dk-view { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.dk-slide { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center; background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; font-size: 16px; }
.dk-bar { height: 4px; background: var(--line); } .dk-bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .35s; }

(function () {

    steps: [
      { tag: "PROBLEMA", label: "Dos tipos", title: "Dos tipos de organización, una sola plataforma",
        body: ["SISG es el Sistema Integral de Salud de Guatemala. Este módulo lo usan **centros de diagnóstico** y **organismos no lucrativos**.", "Los centros registran pacientes y estudios. Los organismos organizan campañas de salud."],
        call: { k: "warn", t: "CUIDADO", x: "Cada organización tiene que ver solo lo suyo. Los datos de salud son sensibles." },
        add: ["ong", "centro"], stats: ["2", "—", "—", "—"],

        chg: [["+", "dos tipos de entidad"]] },
      { tag: "SOLUCION", label: "Una puerta", title: "Una interfaz y una API para todos",

        flow: ["centro-t1", "t1est"], good: ["t1est"], stats: ["1", "2", "1", "—"] },
      { tag: "IDEA", label: "Campañas", title: "Lo mismo con las campañas",

<script>
/* Piezas dinámicas de la presentación: tablas reales, gráficas y las 8 consultas calculadas en el navegador
   sobre los mismos datos del almacén (data/dw.js, extraídos de entrega_sql/). */
(function () {
  "use strict";
  const D = window.DW;
  const X = (window.DWX = {});
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const N = (n) => Number(n).toLocaleString("en-US");
  const Q = (n) => "Q " + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  X.N = N; X.Q = Q; X.esc = esc;

  /* ---------- índices de las dimensiones ---------- */
  const T = new Map(D.dw.tiempo.rows.map((r) => [r[0], r]));          // key, fecha, anio, trimestre, mes, nombre_mes, dia, dia_semana, fin_semana
  const G = new Map(D.dw.geografia.rows.map((r) => [r[0], r]));       // key, dep_id, mun_id, departamento, municipio
  const E = new Map(D.dw.entidad.rows.map((r) => [r[0], r]));         // key, id, nombre, tipo_entidad, departamento
  const P = new Map(D.dw.paciente.rows.map((r) => [r[0], r]));        // key, id, sexo
  const GR = new Map(D.dw.grupo.rows.map((r) => [r[0], r]));          // key, etiqueta, min, max
  const TP = new Map(D.dw.tipo.rows.map((r) => [r[0], r]));           // key, id, nombre, categoria
  const AR = new Map(D.dw.area.rows.map((r) => [r[0], r]));           // key, id, area
  const FE = D.dw.fe.rows;   // id, tiempo, entidad, geo, paciente, tipo, grupo, estado(0 REALIZADO, 2 CANCELADO), costo, dur
  const FC = D.dw.fc.rows;   // id, t_ini, t_fin, entidad, geo, area, estado, personas, presupuesto, dias
  const MEN = D.dw.mensual.rows; // anio, mes, entidad, tipo, total, ingresos, dur_prom
  X.idx = { T, G, E, P, GR, TP, AR };
  const REAL = FE.filter((f) => f[7] === 0);
  const mesTxt = (a, m) => `${a}-${String(m).padStart(2, "0")}`;
  const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

  /* ---------- tabla HTML ---------- */
  X.table = function (cols, rows, o) {
    o = o || {};
    const hl = new Set(o.hl || []);
    return `<table class="dt"><thead><tr>${cols.map((c) => `<th class="${hl.has(c) ? "hl" : ""}">${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
      rows.map((r, ri) => `<tr class="${o.row === ri ? "pick" : ""}">${r.map((v, i) => {
        const num = typeof v === "number", cls = (num ? "n " : "") + (hl.has(cols[i]) ? "hl " : "") + (v === null ? "nul" : "");
        return `<td class="${cls}">${v === null ? "NULL" : num ? (Number.isInteger(v) ? v : v.toFixed(2)) : esc(v)}</td>`;
      }).join("")}</tr>`).join("") + `</tbody></table>`;
  };

  /* ---------- barras ---------- */
  X.hbars = function (items, o) {
    o = o || {}; const max = Math.max(...items.map((i) => i.value), 1);
    return `<div class="hb">${items.map((i) => `<div class="hbr ${i.cls || ""}"><span class="hl">${esc(i.label)}</span><span class="hbt"><i style="width:${(i.value / max) * 100}%;${i.color ? "background:" + i.color : ""}"></i></span><b>${esc(i.text != null ? i.text : N(i.value))}</b></div>`).join("")}</div>`;
  };
  X.vbars = function (items, o) {
    o = o || {}; const max = Math.max(...items.map((i) => Math.abs(i.value)), 1), min = Math.min(0, ...items.map((i) => i.value));
    const span = max - min || 1, top = (Math.max(0, ...items.map((i) => i.value)) / span) * 100;   // % desde arriba donde está el cero
    return `<div class="vb" style="--n:${items.length}">${items.map((i) => {
      const h = (Math.abs(i.value) / span) * 100, up = i.value >= 0;
      return `<div class="vbc" title="${esc(i.label)}: ${esc(i.text != null ? i.text : N(i.value))}"><div class="vbm"><i class="${up ? "up" : "dn"}" style="height:${h}%;${up ? `bottom:${100 - top}%` : `top:${top}%`}"></i></div><small>${esc(i.short != null ? i.short : "")}</small></div>`;
    }).join("")}</div>`;
  };

  /* =====================================================================
     LAS CONSULTAS (06_consultas.sql) calculadas en el navegador
     ===================================================================== */
  const deps = [...new Set(D.dw.geografia.rows.filter((r) => r[0] !== -1).map((r) => r[3]))].sort(cmp);
  const centros = D.dw.entidad.rows.filter((r) => /centro/i.test(r[3])).map((r) => r[2]);
  const cats = [...new Set(D.dw.tipo.rows.map((r) => r[3]))];
  X.options = { deps, centros, cats };

  function q1() {
    const m = new Map();
    for (const f of REAL) {
      const t = T.get(f[1]), cat = TP.get(f[5])[3], k = t[2] * 100 + t[4] + "|" + cat;
      let o = m.get(k); if (!o) m.set(k, (o = { a: t[2], m: t[4], cat, n: 0, s: 0 }));
      o.n++; o.s += f[8];
    }
    return [...m.values()].sort((a, b) => a.a - b.a || a.m - b.m || b.s - a.s);
  }
  function monthSeries(rows) { const s = new Map(); for (const r of rows) { const k = mesTxt(r.a, r.m); s.set(k, (s.get(k) || 0) + r.s); } return [...s].map(([label, value]) => ({ label, value })); }

  X.queries = [
    { n: 1, short: "Estudios e ingresos por mes y categoría", q: "¿Cuántos estudios y cuánto ingreso hubo cada mes, por categoría de estudio?",
      sql: "SELECT t.anio, t.mes, te.categoria,\n       COUNT(*) AS estudios, SUM(f.costo_q) AS ingresos_q\nFROM fact_estudio f\nJOIN dim_tiempo t       ON t.tiempo_key = f.tiempo_key\nJOIN dim_tipo_estudio te ON te.tipo_estudio_key = f.tipo_estudio_key\nWHERE f.estado = 'REALIZADO'\nGROUP BY t.anio, t.mes, te.categoria\nORDER BY t.anio, t.mes, ingresos_q DESC;",
      dims: ["fact_estudio", "dim_tiempo", "dim_tipo_estudio"], tech: "hecho + 2 dimensiones", scanned: FE.length,
      run() { const r = q1(); const s = monthSeries(r);
        return { cols: ["anio", "mes", "categoria", "estudios", "ingresos_q"], rows: r.map((o) => [o.a, o.m, o.cat, o.n, +o.s.toFixed(2)]),
          chart: { kind: "v", title: "Ingresos por mes (Q)", items: s.map((x) => ({ label: x.label, short: x.label.endsWith("-01") || x.label.endsWith("-07") ? x.label : "", value: x.value, text: Q(x.value) })) }, total: r.length }; } },
    { n: 2, short: "Los 3 estudios más frecuentes por departamento", q: "En cada departamento, ¿cuáles son los 3 estudios que más se hacen?",
      sql: "SELECT departamento, tipo_estudio, estudios, posicion\nFROM (\n  SELECT g.departamento, te.tipo_estudio, COUNT(*) AS estudios,\n         RANK() OVER (PARTITION BY g.departamento\n                      ORDER BY COUNT(*) DESC) AS posicion\n  FROM fact_estudio f\n  JOIN dim_geografia g     ON g.geo_key = f.geo_key\n  JOIN dim_tipo_estudio te ON te.tipo_estudio_key = f.tipo_estudio_key\n  WHERE f.estado = 'REALIZADO'\n  GROUP BY g.departamento, te.tipo_estudio\n) r\nWHERE posicion <= 3;",
      dims: ["fact_estudio", "dim_geografia", "dim_tipo_estudio"], tech: "RANK() OVER", scanned: FE.length,
      ctl: { label: "Departamento", options: () => deps, def: () => (deps.includes("Guatemala") ? "Guatemala" : deps[0]) },
      run(dep) { const m = new Map();
        for (const f of REAL) { const g = G.get(f[3]); if (!g || g[3] !== dep) continue; const t = TP.get(f[5])[2]; m.set(t, (m.get(t) || 0) + 1); }
        const arr = [...m].sort((a, b) => b[1] - a[1]); let rank = 0, prev = null, pos = 0;
        const ranked = arr.map(([t, n], i) => { pos = i + 1; if (n !== prev) { rank = pos; prev = n; } return [t, n, rank]; });
        return { cols: ["departamento", "tipo_estudio", "estudios", "posicion"], rows: ranked.filter((r) => r[2] <= 3).map((r) => [dep, r[0], r[1], r[2]]),
          chart: { kind: "h", title: `Estudios por tipo en ${dep}`, items: ranked.map((r) => ({ label: r[0], value: r[1], cls: r[2] <= 3 ? "top" : "" })) }, total: ranked.length }; } },
    { n: 3, short: "Ingresos por centro y trimestre, con acumulado", q: "¿Cuánto ingresa cada centro por trimestre y cuánto lleva acumulado en el año?",
      sql: "SELECT e.nombre AS centro, t.anio, t.trimestre,\n       SUM(f.costo_q) AS ingresos_q,\n       SUM(SUM(f.costo_q)) OVER (\n         PARTITION BY e.nombre, t.anio\n         ORDER BY t.trimestre) AS acumulado_anio\nFROM fact_estudio f\nJOIN dim_entidad e ON e.entidad_key = f.entidad_key\nJOIN dim_tiempo t  ON t.tiempo_key  = f.tiempo_key\nWHERE f.estado = 'REALIZADO'\nGROUP BY e.nombre, t.anio, t.trimestre;",
      dims: ["fact_estudio", "dim_entidad", "dim_tiempo"], tech: "SUM() OVER", scanned: FE.length,

        const arr = [...m].sort((a, b) => a[0] - b[0]); const acc = {}; const rows = arr.map(([k, v]) => { const a = Math.floor(k / 10), q = k % 10; acc[a] = (acc[a] || 0) + v; return [centro, a, q, +v.toFixed(2), +acc[a].toFixed(2)]; });
        return { cols: ["centro", "anio", "trimestre", "ingresos_q", "acumulado_anio"], rows,
          chart: { kind: "v", title: "Ingresos por trimestre (Q)", items: rows.map((r) => ({ label: `${r[1]} T${r[2]}`, short: `T${r[2]}`, value: r[3], text: Q(r[3]) })) }, total: rows.length }; } },
    { n: 4, short: "Perfil de pacientes por sexo y edad", q: "Para una categoría de estudio, ¿qué sexo y grupo de edad tienen los pacientes?",
      sql: "SELECT te.categoria, p.sexo, ge.etiqueta AS grupo_etario,\n       COUNT(*) AS estudios\nFROM fact_estudio f\nJOIN dim_tipo_estudio te ON te.tipo_estudio_key = f.tipo_estudio_key\nJOIN dim_paciente p      ON p.paciente_key      = f.paciente_key\nJOIN dim_grupo_etario ge ON ge.grupo_etario_key = f.grupo_etario_key\nWHERE f.estado = 'REALIZADO'\nGROUP BY te.categoria, p.sexo, ge.etiqueta;",
      dims: ["fact_estudio", "dim_tipo_estudio", "dim_paciente", "dim_grupo_etario"], tech: "4 dimensiones", scanned: FE.length,
      ctl: { label: "Categoría", options: () => cats, def: () => cats[0] },
      run(cat) { const m = new Map();
        for (const f of REAL) { if (TP.get(f[5])[3] !== cat) continue; const sx = P.get(f[4])[2], g = GR.get(f[6])[1], k = sx + "|" + g; m.set(k, (m.get(k) || 0) + 1); }
        const order = D.dw.grupo.rows.map((r) => r[1]); const rows = [...m].map(([k, n]) => { const [s, g] = k.split("|"); return [cat, s, g, n]; }).sort((a, b) => cmp(a[1], b[1]) || order.indexOf(a[2]) - order.indexOf(b[2]));
        const sexos = [...new Set(rows.map((r) => r[1]))];
        return { cols: ["categoria", "sexo", "grupo_etario", "estudios"], rows,
          chart: { kind: "h", title: `Estudios de ${cat}: sexo y grupo de edad`, items: rows.map((r) => ({ label: `${r[1]} · ${r[2]}`, value: r[3], color: r[1] === sexos[0] ? "var(--c-blue)" : "var(--c-pink)" })) }, total: rows.length }; } },
    { n: 5, short: "Campañas: personas atendidas y costo por persona", q: "¿A cuántas personas atendió cada área de campaña y a qué costo por persona?",
      sql: "SELECT a.area, COUNT(*) AS campanas,\n       SUM(c.personas_atendidas) AS personas,\n       ROUND(SUM(c.presupuesto_q) /\n             NULLIF(SUM(c.personas_atendidas), 0), 2) AS costo_por_persona_q\nFROM fact_campana c\nJOIN dim_area_campana a ON a.area_key = c.area_key\nWHERE c.personas_atendidas > 0\nGROUP BY a.area\nORDER BY personas DESC;",
      dims: ["fact_campana", "dim_area_campana"], tech: "NULLIF", scanned: FC.length,
      run() { const m = new Map();
        for (const c of FC) { if (!(c[7] > 0)) continue; const a = AR.get(c[5])[2]; let o = m.get(a); if (!o) m.set(a, (o = { n: 0, p: 0, b: 0 })); o.n++; o.p += c[7]; o.b += c[8] || 0; }
        const rows = [...m].sort((a, b) => b[1].p - a[1].p).map(([a, o]) => [a, o.n, o.p, o.p ? +(o.b / o.p).toFixed(2) : null]);
        return { cols: ["area", "campanas", "personas", "costo_por_persona_q"], rows,
          chart: { kind: "h", title: "Personas atendidas por área", items: rows.map((r) => ({ label: r[0], value: r[2], text: N(r[2]) + " · " + (r[3] != null ? Q(r[3]) + "/persona" : "") })) }, total: rows.length }; } },
    { n: 6, short: "Estudios vs campañas por departamento (cruce)", q: "¿Dónde hay más estudios y dónde más personas atendidas en campañas, por departamento?",
      sql: "SELECT g.departamento,\n       COALESCE(e.estudios, 0)  AS estudios,\n       COALESCE(c.personas, 0)  AS personas_en_campanas\nFROM (SELECT DISTINCT departamento\n      FROM dim_geografia WHERE geo_key <> -1) g\nLEFT JOIN (/* estudios REALIZADO por departamento */) e\n       ON e.departamento = g.departamento\nLEFT JOIN (/* personas de fact_campana por departamento */) c\n       ON c.departamento = g.departamento\nORDER BY estudios DESC;",
      dims: ["fact_estudio", "fact_campana", "dim_geografia"], tech: "dimensión conformada", scanned: FE.length + FC.length,
      run() { const m = new Map(deps.map((d) => [d, { e: 0, p: 0 }]));

        const rows = [...m].sort((a, b) => b[1].e - a[1].e).map(([d, o]) => [d, o.e, o.p]);

    { n: 7, short: "Crecimiento mensual de estudios", q: "¿Cuánto creció o bajó cada mes la cantidad de estudios respecto al anterior?",
      sql: "SELECT anio, mes, estudios,\n       LAG(estudios) OVER (ORDER BY anio, mes) AS mes_anterior,\n       ROUND(100 * (estudios - LAG(estudios) OVER (ORDER BY anio, mes))\n             / LAG(estudios) OVER (ORDER BY anio, mes), 1) AS variacion_pct\nFROM (SELECT anio, mes, SUM(total_estudios) AS estudios\n      FROM fact_estudio_mensual\n      GROUP BY anio, mes) m\nORDER BY anio, mes;",
      dims: ["fact_estudio_mensual"], tech: "LAG()", scanned: MEN.length,
      run() { const m = new Map(); for (const r of MEN) { const k = r[0] * 100 + r[1]; m.set(k, (m.get(k) || 0) + r[4]); }
        const arr = [...m].sort((a, b) => a[0] - b[0]); const rows = arr.map(([k, n], i) => { const prev = i ? arr[i - 1][1] : null; return [Math.floor(k / 100), k % 100, n, prev, prev ? +((100 * (n - prev)) / prev).toFixed(1) : null]; });
        return { cols: ["anio", "mes", "estudios", "mes_anterior", "variacion_pct"], rows,

    { n: 8, short: "Lo mismo que la 1, desde la tabla resumen", q: "La misma pregunta que la consulta 1, pero leyendo la tabla de sumarización.",
      sql: "SELECT m.anio, m.mes, te.categoria,\n       SUM(m.total_estudios) AS estudios,\n       SUM(m.ingresos_q)     AS ingresos_q\nFROM fact_estudio_mensual m\nJOIN dim_tipo_estudio te\n  ON te.tipo_estudio_key = m.tipo_estudio_key\nGROUP BY m.anio, m.mes, te.categoria\nORDER BY m.anio, m.mes, ingresos_q DESC;",
      dims: ["fact_estudio_mensual", "dim_tipo_estudio"], tech: "tabla de sumarización", scanned: MEN.length,
      run() { const m = new Map();
        for (const r of MEN) { const cat = TP.get(r[3])[3], k = r[0] * 100 + r[1] + "|" + cat; let o = m.get(k); if (!o) m.set(k, (o = { a: r[0], m: r[1], cat, n: 0, s: 0 })); o.n += r[4]; o.s += r[5]; }
        const rows8 = [...m.values()].sort((a, b) => a.a - b.a || a.m - b.m || b.s - a.s);
        const rows1 = q1(); let same = rows1.length === rows8.length;

        const s = monthSeries(rows8);
        return { cols: ["anio", "mes", "categoria", "estudios", "ingresos_q"], rows: rows8.map((o) => [o.a, o.m, o.cat, o.n, +o.s.toFixed(2)]),

    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    bars: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20v-6M12 20V8M19 20v-9"/></svg>',
    steps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    folder: (c) => `<svg class="fold" viewBox="0 0 22 18"><path d="M1 3a2 2 0 012-2h5l2 2h9a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2z" fill="${c}" stroke="#1d1b18" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  };

  /* ---------- estado ---------- */
  const lessons = D.modules.flatMap((m) => m.lessons.map((l) => Object.assign(l, { mod: m })));
  const byId = Object.fromEntries(lessons.map((l) => [l.id, l]));
  let progress = store.get("progress", {});        // id de lección -> paso máximo visto (1..n)
  let known = store.get("known", {});               // preguntas marcadas como sabidas
  let openMods = new Set(["m1"]);
  let cur = { view: null, lesson: null, step: 0 };
  let paused = false, scene = null, flowTimer = 0, rafId = 0;

  const shell = $("#shell");

  /* ---------- tema ---------- */
  function setTheme(t) { document.documentElement.dataset.theme = t; store.set("theme", t); }
  setTheme(store.get("theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("#b-theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

  /* =====================================================================
     ESCENA
     ===================================================================== */
  const C3 = 0.866;
  function nodeInfo(n) {
    if (n.k === "tbl") { n.hh = n.hh || 26; n.rh = n.rh || 17; n.fs = n.fs || 11; n.W = n.w || 200; n.H = n.hh + n.cols.length * n.rh + 6; n.cx = n.x + n.W / 2; n.cy = n.y + n.H / 2; }
    else { n.cx = n.x; n.cy = n.y; n.r = n.k === "cube" ? (n.s || 66) * 0.98 : n.k === "db" ? 62 : n.k === "bar" ? 40 : 34; }
    return n;
  }
  function anchor(n, tx, ty) {
    const dx = tx - n.cx, dy = ty - n.cy, d = Math.hypot(dx, dy) || 1;
    if (n.k === "tbl") { const t = Math.min((n.W / 2 + 5) / Math.abs(dx || 1e-9), (n.H / 2 + 5) / Math.abs(dy || 1e-9)); return { x: n.cx + dx * t, y: n.cy + dy * t }; }
    return { x: n.cx + (dx / d) * (n.r + 5), y: n.cy + (dy / d) * (n.r + 5) };
  }
  function lines(g, text, x, y, size, weight, fill, lh, cls) {
    String(text).split("\n").forEach((ln, i, arr) => {
      const t = svg("text", { x, y: y + (i - (arr.length - 1) / 2) * lh, "text-anchor": "middle", "dominant-baseline": "central", "font-size": size, "font-weight": weight, class: cls || "" }, g);
      t.style.fill = fill; t.textContent = ln;
    });
  }
  function drawIcon(g, name, x, y, sc) {
    const p = svg("path", { d: ICON[name] || ICON.db, fill: "none", stroke: INK_FIXED, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", transform: `translate(${x - 12 * sc},${y - 12 * sc}) scale(${sc})` }, g);
    return p;
  }

  function buildNode(def, id, layer) {
    const n = nodeInfo(def);
    const outer = svg("g", { class: "nd off", "data-id": id }, layer);
    const g = svg("g", { transform: `translate(${n.k === "tbl" ? n.x : n.cx},${n.k === "tbl" ? n.y : n.cy})` }, outer);
    const base = D.colors[n.color] || "#ddd", light = mix(base, "#ffffff", 0.5), dark = mix(base, "#000000", 0.14);
    const halo = svg("g", { class: "halo" }, g);
    const body = svg("g", {}, g);
    if (n.k === "cube") {
      const s = n.s || 66, hx = C3 * s;
      const P = (pts) => pts.map((p) => p.join(",")).join(" ");
      const common = { stroke: "var(--ink)", "stroke-width": 2.4, "stroke-linejoin": "round" };
      svg("polygon", Object.assign({ points: P([[0, -s], [hx, -s / 2], [hx, s / 2], [0, s], [-hx, s / 2], [-hx, -s / 2]].map(([a, b]) => [a * 1.18, b * 1.18])), fill: "none", stroke: "var(--ink)", "stroke-width": 3, "stroke-dasharray": "7 5", "stroke-linejoin": "round" }), halo);
      svg("polygon", Object.assign({ points: P([[-hx, -s / 2], [0, 0], [0, s], [-hx, s / 2]]), fill: base }, common), body);
      svg("polygon", Object.assign({ points: P([[0, 0], [hx, -s / 2], [hx, s / 2], [0, s]]), fill: dark }, common), body);
      svg("polygon", Object.assign({ points: P([[0, -s], [hx, -s / 2], [0, 0], [-hx, -s / 2]]), fill: light }, common), body);
      if (n.icon) drawIcon(body, n.icon, 0, -s / 2, 0.95);
      lines(body, n.label, 0, s * 0.36, 12.5, 800, INK_FIXED, 14);
      if (n.sub) lines(body, n.sub, 0, s + 17, 11, 500, "var(--muted)", 13);
    } else if (n.k === "db") {
      const r = 56, H = 62, ry = 17;
      svg("rect", { x: -r - 9, y: -H / 2 - ry - 8, width: 2 * r + 18, height: H + 2 * ry + 16, rx: 22, fill: "none", stroke: "var(--ink)", "stroke-width": 3, "stroke-dasharray": "7 5" }, halo);
      svg("path", { d: `M${-r},${-H / 2} L${-r},${H / 2} A${r},${ry} 0 0 0 ${r},${H / 2} L${r},${-H / 2} Z`, fill: base, stroke: "var(--ink)", "stroke-width": 2.4, "stroke-linejoin": "round" }, body);
      svg("path", { d: `M${-r},${-H / 6} A${r},${ry} 0 0 0 ${r},${-H / 6}`, fill: "none", stroke: "var(--ink)", "stroke-width": 1.4, opacity: 0.4 }, body);
      svg("ellipse", { cx: 0, cy: -H / 2, rx: r, ry, fill: light, stroke: "var(--ink)", "stroke-width": 2.4 }, body);
      lines(body, n.label, 0, H * 0.22, 14, 800, INK_FIXED, 15);
      if (n.sub) lines(body, n.sub, 0, H / 2 + ry + 16, 11, 500, "var(--muted)", 13);
    } else if (n.k === "tbl") {
      svg("rect", { x: -6, y: -6, width: n.W + 12, height: n.H + 12, rx: 13, fill: "none", stroke: "var(--ink)", "stroke-width": 3, "stroke-dasharray": "7 5" }, halo);
      svg("rect", { x: 3, y: 3, width: n.W, height: n.H, rx: 9, fill: "var(--ink)" }, body);
      svg("rect", { x: 0, y: 0, width: n.W, height: n.H, rx: 9, fill: "var(--card)", stroke: "var(--ink)", "stroke-width": 2 }, body);
      svg("path", { d: `M0,${n.hh} L0,9 A9,9 0 0 1 9,0 L${n.W - 9},0 A9,9 0 0 1 ${n.W},9 L${n.W},${n.hh} Z`, fill: base, stroke: "var(--ink)", "stroke-width": 2 }, body);
      const t = svg("text", { x: 10, y: n.hh / 2 + 1, "dominant-baseline": "central", "font-size": n.fs + 1.5, "font-weight": 800 }, body); t.style.fill = INK_FIXED; t.textContent = n.title;
      n.rowEls = {};
      n.cols.forEach((c, i) => {
        const m = /^(PK|FK)\s+(.*)$/.exec(c), name = (m ? m[2] : c).split(/\s+/)[0], y = n.hh + i * n.rh, rh = n.rh;
        const row = svg("g", {}, body);
        const bg = svg("rect", { x: 3, y: y + 1, width: n.W - 6, height: rh - 1, rx: 4, fill: "transparent" }, row);
        if (m) {
          const pill = svg("rect", { x: 7, y: y + rh / 2 - 4.5, width: 18, height: 9, rx: 3, fill: m[1] === "PK" ? "#f3c24d" : "#a9c8ee", stroke: INK_FIXED, "stroke-width": 1 }, row);
          const pt = svg("text", { x: 16, y: y + rh / 2 + 0.2, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 7, "font-weight": 800 }, row); pt.style.fill = INK_FIXED; pt.textContent = m[1];
        }
        const tx = svg("text", { x: m ? 31 : 10, y: y + rh / 2 + 0.5, "dominant-baseline": "central", "font-size": n.fs }, row); tx.style.fill = "var(--ink)"; tx.textContent = m ? m[2] : c;
        n.rowEls[name] = bg;
      });
    } else if (n.k === "bar") {
      const w = n.w || 100, h = n.h, d = 22;
      const P = (pts) => pts.map((p) => p.join(",")).join(" ");
      const common = { stroke: "var(--ink)", "stroke-width": 2.4, "stroke-linejoin": "round" };
      svg("polygon", Object.assign({ points: P([[-w / 2, 0], [w / 2, 0], [w / 2, -h], [-w / 2, -h]]), fill: base }, common), body);
      svg("polygon", Object.assign({ points: P([[w / 2, 0], [w / 2 + d, -d * 0.55], [w / 2 + d, -h - d * 0.55], [w / 2, -h]]), fill: dark }, common), body);
      svg("polygon", Object.assign({ points: P([[-w / 2, -h], [w / 2, -h], [w / 2 + d, -h - d * 0.55], [-w / 2 + d, -h - d * 0.55]]), fill: light }, common), body);
      lines(body, n.label, d / 2, -h - d * 0.55 - 18, 17, 800, "var(--ink)", 18);
      if (n.sub) lines(body, n.sub, d / 2, 24, 11, 500, "var(--muted)", 13);
    } else if (n.k === "text") {
      lines(body, n.text, 0, 0, n.size || 40, 800, "var(--ink)", 1);
      if (n.sub) lines(body, n.sub, 0, (n.size || 40) * 0.75, 14, 600, "var(--muted)", 16);
    }
    return Object.assign(n, { outer, halo });
  }

  function buildScene(lesson, rootEl) {
    const root = rootEl || $("#scene"); root.innerHTML = "";
    const VB = lesson.vb || [1000, 600]; root.setAttribute("viewBox", `0 0 ${VB[0]} ${VB[1]}`);
    const defs = svg("defs", {}, root);
    const pat = svg("pattern", { id: "iso", width: 80, height: 46.2, patternUnits: "userSpaceOnUse" }, defs);
    const gp = svg("path", { d: "M0 0 L80 46.2 M80 0 L0 46.2", fill: "none" }, pat); gp.style.stroke = "var(--grid)"; gp.setAttribute("stroke-width", "1");
    for (const [id, col] of [["ak", "var(--ink)"], ["ar", "#c0392b"], ["ag", "#2f8f3a"]]) {
      const m = svg("marker", { id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" }, defs);
      const p = svg("path", { d: "M1 1 L9 5 L1 9 z", "stroke-linejoin": "round" }, m); p.style.fill = col; p.style.stroke = col;
    }
    svg("rect", { x: 0, y: 0, width: VB[0], height: VB[1], fill: "url(#iso)" }, root);
    const edgeLayer = svg("g", {}, root), nodeLayer = svg("g", {}, root), packLayer = svg("g", {}, root);
    const nodes = {};
    for (const id in lesson.nodes) nodes[id] = buildNode(Object.assign({}, lesson.nodes[id]), id, nodeLayer);
    const edges = {};
    for (const e of lesson.edges) {
      const id = e.id || `${e.a}-${e.b}`, A = nodes[e.a], B = nodes[e.b];
      const via = e.via || [];
      const p0 = anchor(A, (via[0] || [B.cx, B.cy])[0], (via[0] || [B.cx, B.cy])[1]);
      const last = via.length ? via[via.length - 1] : [A.cx, A.cy];
      const p1 = anchor(B, last[0], last[1]);
      const pts = [[p0.x, p0.y], ...via, [p1.x, p1.y]];
      const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const g = svg("g", { class: "ed off", "data-id": id }, edgeLayer);
      const arrow = e.arrow != null ? e.arrow : !(A.k === "tbl" && B.k === "tbl");
      const path = svg("path", { d, fill: "none", "stroke-width": 2.2, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
      path.style.stroke = "var(--ink)"; if (e.dash) path.setAttribute("stroke-dasharray", "6 6"); if (arrow) path.setAttribute("marker-end", "url(#ak)");
      if (A.k === "tbl" && B.k === "tbl") { for (const [pt] of [[pts[0]], [pts[pts.length - 1]]]) { const c = svg("circle", { cx: pt[0], cy: pt[1], r: 3.2 }, g); c.style.fill = "var(--ink)"; } }
      const mid = path.getPointAtLength(path.getTotalLength() / 2);
      let lab = null;
      if (e.label) {
        lab = svg("g", { transform: `translate(${mid.x},${mid.y})` }, g);
        const w = e.label.length * 6.4 + 16;
        const r = svg("rect", { x: -w / 2, y: -10, width: w, height: 20, rx: 10, "stroke-width": 1.5 }, lab); r.style.fill = "var(--card)"; r.style.stroke = "var(--ink)";
        const t = svg("text", { x: 0, y: 0, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 10.5, "font-weight": 600 }, lab); t.style.fill = "var(--ink)"; t.textContent = e.label;
      }
      const badge = svg("g", { transform: `translate(${mid.x},${mid.y})`, class: "badge", opacity: 0 }, g);
      edges[id] = { id, def: e, g, path, pts, mid, lab, badge, A, B };
    }
    const S = { lesson, nodes, edges, packLayer, packs: [], root, onNode: null };
    root.addEventListener("click", (e) => { const g = e.target.closest(".nd"); if (g && S.onNode && !g.classList.contains("off")) S.onNode(g.dataset.id); });
    return S;
  }

  /* estado visible acumulado hasta el paso i */
  function stateAt(lesson, i) {
    const V = new Set(), E = new Set();
    for (let k = 0; k <= i; k++) {
      const s = lesson.steps[k];
      (s.add || []).forEach((x) => V.add(x)); (s.rm || []).forEach((x) => V.delete(x));
      (s.eadd || []).forEach((x) => E.add(x)); (s.erm || []).forEach((x) => E.delete(x));
    }
    return { V, E };
  }

  function applyStep(i, replay, SS) {
    const S = SS || scene, lesson = S.lesson, step = lesson.steps[i];
    const { V, E } = stateAt(lesson, i);
    const focus = new Set(step.focus || []);
    const hasFocus = focus.size > 0;
    const rows = step.rows || {};
    let delay = 0;
    for (const id in S.nodes) {
      const n = S.nodes[id], vis = V.has(id), el = n.outer;
      const wasOff = el.classList.contains("off");
      if (replay && vis) { el.classList.add("off"); }
      const show = () => {
        el.classList.toggle("off", !vis);
        el.classList.toggle("dim", vis && hasFocus && !focus.has(id));
        el.classList.toggle("focus", vis && focus.has(id));
      };
      if (vis && (wasOff || replay)) { setTimeout(show, 60 + delay); delay += 70; } else show();
      if (n.rowEls) for (const name in n.rowEls) n.rowEls[name].setAttribute("fill", (rows[id] || []).includes(name) ? "#f6d98a" : "transparent");
      if (n.rowEls) for (const name in n.rowEls) { const t = n.rowEls[name].parentNode.lastChild; t.style.fill = (rows[id] || []).includes(name) ? INK_FIXED : "var(--ink)"; }
    }
    const bad = new Set(step.bad || []), good = new Set(step.good || []);
    for (const id in S.edges) {
      const e = S.edges[id], vis = E.has(id) && V.has(e.def.a) && V.has(e.def.b);
      e.g.classList.toggle("off", !vis);
      e.g.classList.toggle("dim", vis && hasFocus && !(focus.has(e.def.a) && focus.has(e.def.b)));
      const isBad = bad.has(id), isGood = good.has(id);
      e.path.style.stroke = isBad ? "#c0392b" : isGood ? "#2f8f3a" : "var(--ink)";
      e.path.setAttribute("stroke-dasharray", isBad ? "7 6" : e.def.dash ? "6 6" : "none");
      e.path.setAttribute("marker-end", e.def.arrow === false || (e.A.k === "tbl" && e.B.k === "tbl") ? "" : `url(#${isBad ? "ar" : isGood ? "ag" : "ak"})`);
      e.badge.innerHTML = ""; e.badge.setAttribute("opacity", isBad || isGood ? 1 : 0);
      if (isBad || isGood) {
        const c = svg("circle", { r: 11, "stroke-width": 2 }, e.badge); c.style.fill = isBad ? "#c0392b" : "#2f8f3a"; c.style.stroke = "var(--ink)";
        svg("path", { d: isBad ? "M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5" : "M-5 0.5 L-1.5 4 L5 -3.5", fill: "none", stroke: "#fff", "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round" }, e.badge);
        if (e.lab) e.lab.setAttribute("opacity", 0);
      } else if (e.lab) e.lab.setAttribute("opacity", 1);
    }
    // paquetes de datos
    S.packLayer.innerHTML = ""; S.packs = [];
    for (const id of step.flow || []) {
      const e = S.edges[id]; if (!e || !E.has(id) || bad.has(id) && false) continue;
      for (let k = 0; k < 3; k++) {
        const g = svg("g", {}, S.packLayer);
        const r = svg("rect", { x: -5, y: -5, width: 10, height: 10, rx: 2.5, "stroke-width": 1.8, fill: "#f3a14d" }, g); r.style.stroke = INK_FIXED;
        S.packs.push({ g, e, off: k / 3, len: e.path.getTotalLength() });
      }
    }
    S.paused = false; flowTimer = 0; movePacks(0);
  }

  function movePacks(t) {
    if (!scene) return;
    for (const p of scene.packs) {
      const u = REDUCED ? 0.5 : (t * 0.28 + p.off) % 1;
      const q = p.e.path.getPointAtLength(p.len * u);
      p.g.setAttribute("transform", `translate(${q.x},${q.y})`);
      const vis = !p.e.g.classList.contains("off");
      p.g.style.opacity = vis ? (u < 0.06 || u > 0.94 ? 0.3 : 1) : 0;
    }
  }
  let last = 0;
  function loop(ts) {
    const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
    if (!paused) flowTimer += dt;
    movePacks(flowTimer);
    rafId = requestAnimationFrame(loop);
  }

  /* =====================================================================
     VISTAS
     ===================================================================== */
  function lessonIndex(id) { return lessons.findIndex((l) => l.id === id); }
  const doneCount = () => lessons.filter((l) => (progress[l.id] || 0) >= l.steps.length).length;

  function treeHTML() {
    return `<div class="tree-head">Curso <small>${lessons.length} lecciones</small></div><div class="tree-body">` +
      D.modules.map((m) => {
        const open = openMods.has(m.id), dn = m.lessons.filter((l) => (progress[l.id] || 0) >= l.steps.length).length;
        return `<div class="mod ${open ? "open" : ""}" data-m="${m.id}"><button type="button" aria-expanded="${open}">${UI.chev}${UI.folder(D.colors[m.color])}<span>${m.n}. ${esc(m.title)}</span><span class="cnt">${dn}/${m.lessons.length}</span></button><ul>` +
          m.lessons.map((l) => `<li><a class="lsn ${(progress[l.id] || 0) >= l.steps.length ? "done" : ""}" href="#/leccion/${l.id}/1" ${cur.lesson && cur.lesson.id === l.id ? 'aria-current="page"' : ""}>${(progress[l.id] || 0) >= l.steps.length ? UI.done : UI.doc}<span>${esc(l.title)}</span></a></li>`).join("") +
          `</ul></div>`;
      }).join("") + `</div>
      <div class="prog"><div class="row"><span>PROGRESO</span><span>${doneCount()} / ${lessons.length}</span></div><div class="bar"><i style="width:${(doneCount() / lessons.length) * 100}%"></i></div></div>
      <div class="credit">Diseño inspirado en <a href="https://designed-to-scale.vercel.app/" target="_blank" rel="noopener">System Design</a>. Datos sintéticos.</div>`;
  }
  function bindTree() {
    $("#tree").querySelectorAll(".mod > button").forEach((b) => b.addEventListener("click", () => {
      const id = b.parentNode.dataset.m; openMods.has(id) ? openMods.delete(id) : openMods.add(id); b.parentNode.classList.toggle("open"); b.setAttribute("aria-expanded", openMods.has(id));
    }));
    $("#tree").querySelectorAll(".lsn").forEach((a) => a.addEventListener("click", () => $("#tree").classList.remove("open")));
  }

  function renderLesson(id, step) {
    const lesson = byId[id]; if (!lesson) return route("#/leccion/que-es/1");
    cur = { view: "lesson", lesson, step };
    openMods.add(lesson.mod.id);
    const idx = lessonIndex(id), within = lesson.mod.lessons.indexOf(lesson) + 1;
    shell.innerHTML = `
      <aside id="tree" class="panel">${treeHTML()}</aside>
      <main id="main" class="panel scroll">
        <div class="crumb">${lesson.mod.n}. ${esc(lesson.mod.title)} &nbsp;/&nbsp; <b>Lección ${within} de ${lesson.mod.lessons.length}</b></div>
        <div class="title-row"><h1 class="lt">${fmt(lesson.title)}</h1><div class="chips"><span class="chip">${UI.clock} ${lesson.min} min</span><span class="chip lv">${UI.bars} ${lesson.level}</span><span class="chip st">${UI.steps} ${lesson.steps.length} pasos</span></div></div>
        <p class="sub">${fmt(lesson.sub)}</p>
        <div class="stage" id="stage">
          <div class="stats">${lesson.statLabels.map((l, i) => `<div class="stat" data-i="${i}"><small>${esc(l)}</small><b>—</b></div>`).join("")}
            <div class="ctl"><button class="btn" id="b-replay" type="button">${UI.redo} Repetir</button><button class="btn" id="b-pause" type="button">${UI.pause} <span>Pausa</span></button></div></div>
          <svg id="scene" viewBox="0 0 1000 600" role="img" aria-label="Diagrama de la lección: ${esc(lesson.title)}"></svg>
          <div class="note off" id="note"></div>
          <div class="legend"><span><i style="background:#f3a14d"></i>dato en movimiento</span><span><i style="background:transparent;border-style:dashed"></i>foco del paso</span><span style="color:#c0392b">✕ rechazado</span><span style="color:#2f8f3a">✓ aceptado</span></div>
        </div>
        <div class="stepper"><h5>En esta lección <span id="stp-n"></span></h5><div class="steps" id="steps">${lesson.steps.map((s, i) => `<button class="sp" type="button" data-i="${i}"><span class="dot">${i + 1}</span><span>${esc(s.label)}</span></button>`).join("")}</div></div>
      </main>
      <aside id="side"><section class="panel stepcard" id="stepcard"></section><section class="panel learn" id="learn"></section></aside>`;
    bindTree();
    scene = buildScene(lesson);
    $("#b-replay").addEventListener("click", () => applyStep(cur.step, true));
    $("#b-pause").addEventListener("click", togglePause);
    $("#steps").querySelectorAll(".sp").forEach((b) => b.addEventListener("click", () => goStep(+b.dataset.i + 1)));
    paused = false;
    setActive("aprender");
    showStep(step, true);
    if (!rafId) rafId = requestAnimationFrame(loop);
    $("#main").scrollTop = 0;
  }

  function togglePause() {
    paused = !paused; $("#stage").classList.toggle("paused", paused);
    $("#b-pause").innerHTML = (paused ? UI.play : UI.pause) + `<span>${paused ? "Seguir" : "Pausa"}</span>`;
  }

  function showStep(i, first) {
    const lesson = cur.lesson, step = lesson.steps[i]; cur.step = i;
    const seen = Math.max(progress[lesson.id] || 0, i + 1);
    if (seen !== progress[lesson.id]) { progress[lesson.id] = seen; store.set("progress", progress); }
    applyStep(i, false);
    // estadísticas
    $("#stage").querySelectorAll(".stat").forEach((el, k) => {
      const v = (step.stats || [])[k] ?? "—", b = el.querySelector("b");
      if (b.textContent !== v) { b.textContent = v; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
    });
    // nota
    const note = $("#note"), nt = step.note;
    if (nt) {
      note.className = "note " + nt.pos + (nt.wide ? " wide" : "");
      note.innerHTML = `<h6>${UI.bulb.replace("<svg", '<svg width="14" height="14"')} ${esc(nt.title)}</h6>` + nt.lines.map((l) => (typeof l === "string" ? `<div>${fmt(l)}</div>` : `<div>${l[0] ? `<b>${esc(l[0])}</b>` : ""}<i>${fmt(l[1])}</i></div>`)).join("");
    } else note.className = "note off";
    // panel de texto
    const sg = { "+": "p", "−": "m", t: "t" }, sy = { "+": "+", "−": "−", t: "~" };
    const tag = step.tag, nextStep = lesson.steps[i + 1], nextLesson = lessons[lessonIndex(lesson.id) + 1];
    $("#stepcard").innerHTML = `
      <div class="meta"><span>Paso ${i + 1} / ${lesson.steps.length}</span><span class="tag ${tag}">${TAGS[tag] || tag}</span></div>
      <h2>${fmt(step.title)}</h2>
      ${step.body.map((p) => `<p>${fmt(p)}</p>`).join("")}
      ${step.call ? `<div class="call ${step.call.k === "idea" ? "" : step.call.k}">${UI.bulb}<div><b>${esc(step.call.t)}</b>${fmt(step.call.x)}</div></div>` : ""}
      ${step.chg ? `<div class="chg"><b class="h">Qué cambió</b><ul>${step.chg.map(([k, t]) => `<li><s class="${sg[k]}">${sy[k]}</s><span>${fmt(t)}</span></li>`).join("")}</ul></div>` : ""}
      <div class="nav"><button class="btn" id="b-prev" type="button" ${i === 0 ? "disabled" : ""}>${UI.left} Atrás</button>
        <button class="btn go" id="b-next" type="button" ${!nextStep && !nextLesson ? "disabled" : ""}><span>${nextStep ? "Siguiente: " + esc(nextStep.label) : nextLesson ? "Siguiente lección: " + esc(nextLesson.title) : "Fin del curso"}</span>${UI.right}</button></div>
      <div class="keys"><kbd class="kbd">←</kbd><kbd class="kbd">→</kbd> paso · <kbd class="kbd">R</kbd> repetir · <kbd class="kbd">Espacio</kbd> pausa</div>`;
    $("#b-prev").onclick = () => goStep(i);
    $("#b-next").onclick = () => nextStep ? goStep(i + 2) : nextLesson && route(`#/leccion/${nextLesson.id}/1`);
    $("#stepcard").scrollTop = 0;
    // pasos
    $("#stp-n").textContent = `Paso ${i + 1} de ${lesson.steps.length}`;
    $("#steps").querySelectorAll(".sp").forEach((b, k) => { b.classList.toggle("done", k < i); if (k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); b.querySelector(".dot").innerHTML = k < i ? UI.tick : k + 1; });
    // Aprenderás
    $("#learn").innerHTML = `<h4>Aprenderás</h4><ul>${lesson.learn.map(([t, at]) => `<li class="${seen >= at ? "on" : ""}"><span class="bx">${UI.tick}</span><span>${fmt(t)}</span></li>`).join("")}</ul>`;
    // árbol y progreso
    const tr = $("#tree"); if (tr) { tr.innerHTML = treeHTML(); bindTree(); }
    const h = `#/leccion/${lesson.id}/${i + 1}`; if (location.hash !== h) history.replaceState(null, "", h);
  }
  function goStep(n) { n = Math.max(1, Math.min(cur.lesson.steps.length, n)); showStep(n - 1); }

  function setActive(name) {
    for (const t of ["presentacion", "aprender"]) { const el = $("#t-" + t); if (!el) continue; if (t === name) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current"); }
    if (name === "aprender" && cur.lesson) $("#t-aprender").href = `#/leccion/${cur.lesson.id}/${cur.step + 1}`;
  }

  /* ---------- rutas ---------- */
  function route(hash) { if (location.hash !== hash) location.hash = hash; else onHash(); }
  function onHash() {
    const h = location.hash || "#/p/1";
    let m;
    if ((m = /^#\/p\/(\d+)$/.exec(h))) {
      shell.hidden = true; $("#tree") && $("#tree").classList.remove("open"); cur = { view: "deck", lesson: null, step: 0 };
      setActive("presentacion"); document.body.classList.add("deck-on");
      window.DECK.show(+m[1]);
      return;
    }
    document.body.classList.remove("deck-on"); if (window.DECK) window.DECK.hide(); shell.hidden = false;
    if ((m = /^#\/leccion\/([\w-]+)\/(\d+)$/.exec(h))) {
      const l = byId[m[1]]; if (!l) return route("#/leccion/que-es/1");
      const n = Math.max(1, Math.min(l.steps.length, +m[2])) - 1;
      if (cur.view === "lesson" && cur.lesson.id === l.id) showStep(n); else renderLesson(l.id, n);
    } else location.hash = "#/p/1";
    window.scrollTo(0, 0);
  }
  addEventListener("hashchange", onHash);

  /* ---------- menú móvil ---------- */
  $("#b-menu").addEventListener("click", () => { const t = $("#tree"); if (t) t.classList.toggle("open"); else route("#/leccion/que-es/1"); });

  /* ---------- búsqueda ---------- */
  const sw = $("#sw"), sq = $("#sq"), sres = $("#sres");
  let sel = 0, hits = [];
  const index = lessons.flatMap((l) => [{ t: l.title, s: l.mod.title + " · lección", x: l.title + " " + l.sub, h: `#/leccion/${l.id}/1` }].concat(l.steps.map((s, i) => ({ t: s.title, s: `${l.title} · paso ${i + 1}`, x: s.title + " " + s.body.join(" "), h: `#/leccion/${l.id}/${i + 1}` }))))
    .concat((window.SLIDE_INDEX || []).map((sl, i) => ({ t: sl.title, s: "Presentación · diapositiva " + (i + 1), x: sl.title + " " + (sl.text || ""), h: `#/p/${i + 1}` })));
  const plain = (s) => String(s).replace(/[`*]/g, "");
  function search() {
    const q = norm(sq.value.trim());
    const idx = (window.SLIDE_INDEX && index.length < lessons.length * 8 + window.SLIDE_INDEX.length ? index : index); hits = q ? idx.filter((it) => norm(it.x).includes(q)).slice(0, 12) : idx.filter((it) => /diapositiva/.test(it.s)).slice(0, 12);
    sel = 0;
    sres.innerHTML = hits.length ? hits.map((it, i) => `<button type="button" class="${i === sel ? "sel" : ""}" data-i="${i}">${esc(plain(it.t))}<small>${esc(it.s)}</small></button>`).join("") : `<div class="sempty">No encontré nada con «${esc(sq.value)}».</div>`;
    sres.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => pick(+b.dataset.i)));
  }
  function pick(i) { const it = hits[i]; if (!it) return; closeSearch(); route(it.h); }
  let opener = null;
  function openSearch() { opener = document.activeElement; sw.classList.add("on"); sq.value = ""; search(); sq.focus(); }
  function closeSearch() { sw.classList.remove("on"); if (opener && opener.focus) opener.focus(); }
  $("#b-search").addEventListener("click", openSearch);
  sq.addEventListener("input", search);
  sw.addEventListener("click", (e) => { if (e.target === sw) closeSearch(); });
  sq.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(hits.length, 1); sres.querySelectorAll("button").forEach((b, i) => { b.classList.toggle("sel", i === sel); if (i === sel) b.scrollIntoView({ block: "nearest" }); }); }
    else if (e.key === "Enter") { e.preventDefault(); pick(sel); }
  });

  /* ---------- teclado ---------- */
  addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); sw.classList.contains("on") ? closeSearch() : openSearch(); return; }
    if (e.key === "Escape" && sw.classList.contains("on")) { closeSearch(); return; }
    if (sw.classList.contains("on") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
    if (cur.view !== "lesson") return;
    if (e.key === "ArrowRight") { const l = cur.lesson; if (cur.step < l.steps.length - 1) goStep(cur.step + 2); }
    else if (e.key === "ArrowLeft") goStep(cur.step);
    else if (e.key === "r" || e.key === "R") applyStep(cur.step, true);
    else if (e.key === " " && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); togglePause(); }
  });

  window.SISG = { buildScene, applyStep, setScene(S) { scene = S; flowTimer = 0; }, setPaused(v) { paused = v; }, fmt, esc, UI, lessons, byId, norm, route };

  /* ---------- arranque ---------- */
  const startHash = location.hash || "#/p/1";
  if (!location.hash) history.replaceState(null, "", startHash);
  (document.fonts && document.fonts.load ? Promise.race([document.fonts.load('600 12px "JetBrains Mono"'), new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve()).catch(() => {}).then(onHash);
})();

</script>
</body>
</html>
